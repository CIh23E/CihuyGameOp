<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>HP Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100dvh; overflow:hidden;
    background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    user-select:none; -webkit-user-select:none;
    position:fixed; inset:0; touch-action:none;
  }

  /* ===== STATUS BAR ===== */
  #statusbar {
    position:absolute; top:0; left:0; right:0; height:44px;
    padding:12px 22px 0;
    display:flex; justify-content:space-between; align-items:center;
    font-size:14px; font-weight:600; z-index:100;
  }
  #statusbar .right { display:flex; gap:6px; align-items:center; }
  .signal { display:flex; gap:2px; align-items:flex-end; height:12px; }
  .signal span { width:3px; background:#fff; border-radius:1px; }
  .signal span:nth-child(1){height:4px;} .signal span:nth-child(2){height:6px;}
  .signal span:nth-child(3){height:9px;} .signal span:nth-child(4){height:12px;}
  .battery{width:24px;height:12px;border:1.5px solid #fff;border-radius:3px;
    position:relative;padding:1.5px;}
  .battery::after{content:'';position:absolute;right:-3px;top:50%;
    transform:translateY(-50%);width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0;}
  .battery .fill{width:75%;height:100%;background:#fff;border-radius:1px;}

  /* ===== WALLPAPER ===== */
  #bg {
    position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(circle at 20% 20%, #4a5cff30, transparent 60%),
      radial-gradient(circle at 80% 80%, #ff4a8d30, transparent 60%),
      linear-gradient(135deg,#0f1729 0%,#1a1a3e 50%,#0a0a1e 100%);
  }
  #bg::after {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 60%, #fff8, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff6, transparent),
      radial-gradient(1px 1px at 30% 80%, #fff7, transparent);
    opacity:.6;
  }

  /* ===== HOMESCREEN ===== */
  #home {
    position:absolute; inset:0;
    padding: 60px 18px 80px;
    z-index:2; display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px 10px; align-content:start;
    transition: opacity .3s, transform .3s;
    overflow-y:auto;
  }
  #home.hidden { opacity:0; pointer-events:none; transform:scale(.9); }

  .app {
    display:flex; flex-direction:column; align-items:center; gap:5px;
    transition: transform .15s; cursor:pointer;
  }
  .app:active { transform:scale(.88); }
  .app .icon {
    width:56px; height:56px; border-radius:15px;
    display:flex; align-items:center; justify-content:center;
    font-size:27px;
    box-shadow: 0 6px 16px rgba(0,0,0,.4);
    position:relative; overflow:hidden;
  }
  .app .icon::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, transparent 40%);
    pointer-events:none;
  }
  .app .label {
    font-size:10px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.9);
    font-weight:500; text-align:center; line-height:1.2;
  }
  .i-camera{background:linear-gradient(135deg,#3a3a4a,#1a1a2a);}
  .i-gallery{background:linear-gradient(135deg,#f093fb,#f5576c);}
  .i-chat{background:linear-gradient(135deg,#25d366,#128c7e);}
  .i-mail{background:linear-gradient(135deg,#4285f4,#1a73e8);}
  .i-bank{background:linear-gradient(135deg,#0d47a1,#1565c0);}
  .i-notes{background:linear-gradient(135deg,#fdd835,#f9a825);color:#000;}
  .i-files{background:linear-gradient(135deg,#42a5f5,#1976d2);}
  .i-settings{background:linear-gradient(135deg,#607d8b,#37474f);}
  .i-music{background:linear-gradient(135deg,#ff1744,#d50000);}
  .i-calc{background:linear-gradient(135deg,#757575,#424242);}
  .i-cal{background:linear-gradient(135deg,#fff,#e0e0e0);color:#d32f2f;font-weight:800;font-size:22px;}
  .i-phone{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#000;}
  .i-snake{background:linear-gradient(135deg,#00c853,#1b5e20);}
  .i-insta{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);}
  .i-paint{background:linear-gradient(135deg,#ff6b6b,#ee5a6f);}
  .i-browser{background:linear-gradient(135deg,#4285f4,#ea4335);}
  .i-tiktok{background:linear-gradient(135deg,#000,#1a1a1a);color:#fff;text-shadow:0 0 8px #25f4ee, 0 0 8px #fe2c55;}
  .i-maps{background:linear-gradient(135deg,#34a853,#fbbc04,#ea4335);}
  .i-youtube{background:linear-gradient(135deg,#ff0000,#c4302b);color:#fff;}

  /* ===== APP VIEW ===== */
  #appview {
    position:absolute; inset:0; z-index:200;
    background:#000;
    display:none; flex-direction:column;
    padding-bottom: 48px;
    animation: appOpen .35s cubic-bezier(.2,1,.3,1);
  }
  @keyframes appOpen {
    from { transform: scale(.85); opacity:0; }
    to { transform: scale(1); opacity:1; }
  }
  #appview.closing { animation: appClose .25s forwards; }
  @keyframes appClose { to { transform: scale(.85); opacity:0; } }

  .appbar {
    display:flex; align-items:center; gap:10px;
    padding: 52px 16px 12px;
    background: rgba(28,28,30,.98);
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
    position:relative; z-index:20;
  }
  .appbar .btn {
    width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .appbar .btn:active { background:rgba(255,255,255,.25); }
  .appbar .title { font-size:17px; font-weight:600; flex:1; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px; }
  .appbar .title .brand {
    display:none;
    width:24px; height:24px; border-radius:6px;
    align-items:center; justify-content:center;
    font-size:13px; font-weight:900;
  }
  .appbar .title .brand.yt-mini {
    background:#ff0000; color:#fff; padding-left:2px;
  }
  .appbar .title .brand.tt-mini {
    background:#000; color:#fff;
    text-shadow:1px 0 #25f4ee, -1px 0 #fe2c55;
    border:1px solid #222;
  }
  .appbar.yt .brand.yt-mini { display:flex; }
  .appbar.tt .brand.tt-mini { display:flex; }

  .appcontent {
    flex:1; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    position:relative;
  }

  /* ===== RECENT ===== */
  #recentView {
    position:absolute; inset:0; z-index:300;
    background: rgba(0,0,0,.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display:none; flex-direction:column;
    padding: 60px 20px 80px;
    animation: fadeIn .25s;
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  #recentView h2 {
    font-size:13px; text-transform:uppercase;
    letter-spacing:1px; color:#8e8e93;
    margin-bottom:16px; padding-left:4px;
  }
  #recentList { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .recent-card {
    background: rgba(28,28,30,.95); border-radius:16px; overflow:hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: cardSlide .3s;
  }
  @keyframes cardSlide {
    from { transform: translateY(20px); opacity:0; }
    to { transform: translateY(0); opacity:1; }
  }
  .recent-card .rc-header {
    padding: 12px 16px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .recent-card .rc-icon {
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .recent-card .rc-title { font-size:14px; font-weight:600; flex:1; }
  .recent-card .rc-close {
    width:28px; height:28px; border-radius:50%;
    background:rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .recent-card .rc-close:active { background:#ff3b30; }
  .recent-card .rc-body {
    height: 100px; font-size:12px; color:#8e8e93;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.1));
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #recentView .empty {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    color:#555; font-size:14px; gap:12px;
  }
  #recentView .empty .big { font-size:52px; opacity:.4; }

  /* ===== NAVBAR ===== */
  #navbar {
    position:absolute; bottom:0; left:0; right:0;
    height: 48px; z-index:400;
    background: rgba(0,0,0,.9);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display:flex; justify-content:space-around; align-items:center;
    padding: 0 40px;
    padding-bottom: env(safe-area-inset-bottom, 0);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .nav-btn {
    width: 60px; height: 40px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border-radius: 10px;
    color:#fff; opacity:.85;
  }
  .nav-btn:active { background: rgba(255,255,255,.15); opacity:1; }
  .nav-btn svg { width: 22px; height: 22px; fill: #fff; }

  /* ===== SHARED UI ===== */
  .list-item {
    padding: 14px 18px;
    border-bottom:1px solid rgba(255,255,255,.06);
    display:flex; align-items:center; gap:14px;
  }
  .list-item .li-icon { font-size:26px; flex-shrink:0; }
  .list-item .li-info { flex:1; min-width:0; }
  .list-item .li-title { font-size:15px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-item .li-sub { font-size:12px; color:#8e8e93; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .cam-view { position:absolute; inset:0; background:#000;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: 70px 20px 40px; }
  .cam-scene {
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 35%, #2a2a2a 0 15%, transparent 16%),
      radial-gradient(circle at 50% 55%, #1a1a1a 0 22%, transparent 23%),
      linear-gradient(180deg,#0a0a0a 0%,#000 100%);
  }
  .cam-grid {
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(90deg, transparent 33.33%, rgba(255,255,255,.15) 33.33% 33.5%, transparent 33.5%),
      linear-gradient(90deg, transparent 66.66%, rgba(255,255,255,.15) 66.66% 66.83%, transparent 66.83%),
      linear-gradient(0deg, transparent 33.33%, rgba(255,255,255,.15) 33.33% 33.5%, transparent 33.5%),
      linear-gradient(0deg, transparent 66.66%, rgba(255,255,255,.15) 66.66% 66.83%, transparent 66.83%);
  }
  .cam-top { position:relative; display:flex; justify-content:space-between;
    color:#fff; font-size:13px; z-index:2; }
  .cam-bot { position:relative; display:flex; justify-content:center;
    align-items:center; gap:40px; z-index:2; }
  .cam-shutter {
    width:72px; height:72px; border-radius:50%;
    border:4px solid #fff; background:rgba(255,255,255,.2);
    position:relative; cursor:pointer;
  }
  .cam-shutter::after { content:''; position:absolute; inset:6px;
    border-radius:50%; background:#fff; }
  .cam-shutter:active::after { background:#ff3b30; }
  .cam-side { width:44px; height:44px; border-radius:12px;
    background:rgba(255,255,255,.15); display:flex; align-items:center;
    justify-content:center; font-size:20px; }

  .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
  .gallery-photo { aspect-ratio:1; }

  .chat-item {
    display:flex; align-items:center; gap:12px;
    padding: 12px 16px;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chat-avatar {
    width:50px; height:50px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; flex-shrink:0;
  }
  .chat-info { flex:1; min-width:0; }
  .chat-name { font-size:15px; font-weight:600; margin-bottom:3px; }
  .chat-msg { font-size:13px; color:#8e8e93;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:11px; color:#8e8e93; flex-shrink:0; }

  .bank-header {
    background: linear-gradient(135deg,#0d47a1,#1565c0);
    padding: 24px 20px; border-radius: 0 0 24px 24px; margin-bottom:16px;
  }
  .bank-header .lbl { font-size:12px; opacity:.7; margin-bottom:6px; }
  .bank-header .balance { font-size:32px; font-weight:800; margin-bottom:4px; }
  .bank-header .acc { font-size:13px; opacity:.8; font-family:monospace; }
  .bank-actions { display:grid; grid-template-columns:repeat(4,1fr);
    gap:8px; padding: 0 16px 20px; }
  .bank-action { display:flex; flex-direction:column; align-items:center;
    gap:6px; padding:12px 4px; border-radius:12px;
    background:rgba(255,255,255,.06); font-size:11px; }
  .bank-action .ba-icon { font-size:22px; }
  .tx-item { display:flex; align-items:center; gap:12px;
    padding: 12px 18px; border-bottom:1px solid rgba(255,255,255,.06); }
  .tx-icon { width:40px; height:40px; border-radius:50%;
    background:rgba(255,59,48,.15); color:#ff3b30;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; }
  .tx-icon.in { background:rgba(52,199,89,.15); color:#34c759; }
  .tx-info { flex:1; }
  .tx-name { font-size:14px; font-weight:500; }
  .tx-time { font-size:11px; color:#8e8e93; margin-top:2px; }
  .tx-amt { font-size:14px; font-weight:600; }
  .tx-amt.out { color:#ff3b30; }
  .tx-amt.in { color:#34c759; }

  .note-item {
    padding: 14px 18px; background: rgba(255,255,255,.04);
    border-radius:12px; margin: 0 14px 8px; border-left:3px solid #fdd835;
  }
  .note-item .n-title { font-size:15px; font-weight:600; margin-bottom:4px; }
  .note-item .n-preview { font-size:13px; color:#8e8e93;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-item .n-time { font-size:11px; color:#666; margin-top:6px; }

  .settings-section {
    background: rgba(28,28,30,.8);
    border-radius:12px; margin: 8px 14px 20px; overflow:hidden;
  }
  .settings-section .s-title {
    font-size:12px; color:#8e8e93; text-transform:uppercase;
    padding: 12px 18px 6px; letter-spacing:.5px;
  }
  .settings-row {
    display:flex; align-items:center; gap:12px;
    padding: 13px 18px;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .settings-row:first-child { border-top:none; }
  .settings-row .s-icon {
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; flex-shrink:0;
  }
  .settings-row .s-label { flex:1; font-size:15px; }
  .settings-row .s-value { font-size:13px; color:#8e8e93; }

  .music-body { padding: 20px; text-align:center; }
  .music-art {
    width: 220px; height:220px; border-radius:20px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg,#ff1744,#d50000);
    display:flex; align-items:center; justify-content:center;
    font-size:80px; box-shadow: 0 20px 60px rgba(255,23,68,.4);
  }
  .music-title { font-size:20px; font-weight:700; margin-bottom:6px; }
  .music-artist { font-size:14px; color:#8e8e93; margin-bottom:28px; }
  .music-progress {
    height:4px; background:rgba(255,255,255,.15);
    border-radius:2px; margin: 0 20px 8px; overflow:hidden;
  }
  .music-progress .fill { width:35%; height:100%; background:#ff1744; border-radius:2px; }
  .music-time {
    display:flex; justify-content:space-between;
    font-size:12px; color:#8e8e93; padding:0 20px; margin-bottom:24px;
  }
  .music-controls {
    display:flex; justify-content:center; align-items:center; gap:32px;
  }
  .music-controls .mc {
    font-size:32px; width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
  }
  .music-controls .mc.play {
    width:72px; height:72px; border-radius:50%;
    background:#ff1744; font-size:34px;
    box-shadow: 0 8px 24px rgba(255,23,68,.5);
  }

  .calc-display {
    padding: 80px 24px 24px;
    text-align:right; font-size:56px; font-weight:300;
    min-height:160px; word-break:break-all;
    display:flex; align-items:flex-end; justify-content:flex-end;
  }
  .calc-grid {
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:12px; padding: 0 16px 20px;
  }
  .calc-btn {
    aspect-ratio:1; border-radius:50%;
    background:rgba(255,255,255,.1);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:500; cursor:pointer;
  }
  .calc-btn:active { transform:scale(.9); background:rgba(255,255,255,.25); }
  .calc-btn.op { background:#ff9500; }
  .calc-btn.fn { background:#a5a5a5; color:#000; }
  .calc-btn.zero { grid-column:span 2; aspect-ratio:auto; border-radius:40px; }

  .cal-body { padding: 0 16px 20px; }
  .cal-month { text-align:center; font-size:20px; font-weight:700;
    padding:16px; color:#d32f2f; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-day-name {
    text-align:center; font-size:11px; color:#8e8e93;
    padding:6px 0; font-weight:600;
  }
  .cal-day { aspect-ratio:1; display:flex; align-items:center;
    justify-content:center; font-size:14px; border-radius:50%; }
  .cal-day.today { background:#d32f2f; color:#fff; font-weight:700; }

  .dialer-display {
    padding: 50px 20px 20px;
    text-align:center; font-size:34px; font-weight:300;
    min-height:100px; letter-spacing:2px; font-family:monospace;
  }
  .dialer-grid {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:16px; padding: 0 40px 30px;
  }
  .dial-btn {
    aspect-ratio:1; border-radius:50%;
    background:rgba(255,255,255,.1);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; cursor:pointer;
  }
  .dial-btn:active { transform:scale(.9); background:rgba(255,255,255,.25); }
  .dial-btn .num { font-size:28px; }
  .dial-btn .sub { font-size:9px; color:#8e8e93;
    letter-spacing:1px; margin-top:2px; }
  .dial-call { display:flex; justify-content:center; padding-bottom:20px; }
  .dial-call .call-btn {
    width:72px; height:72px; border-radius:50%;
    background:#34c759; display:flex; align-items:center;
    justify-content:center; font-size:30px; color:#fff;
    box-shadow: 0 8px 24px rgba(52,199,89,.4);
  }

  /* ===== SNAKE ===== */
  .snake-wrap { display:flex; flex-direction:column; align-items:center;
    padding: 20px; gap:16px; }
  .snake-info { display:flex; justify-content:space-between;
    width:100%; max-width:300px;
    font-size:14px; font-weight:600; }
  .snake-info .sc { color:#00c853; }
  #snakeCanvas { background:#0a1a0a; border-radius:12px;
    box-shadow: 0 0 40px rgba(0,200,83,.3); touch-action:none; }
  .snake-controls {
    display:grid; grid-template-columns:repeat(3,56px);
    grid-template-rows:repeat(3,56px); gap:6px; margin-top:8px; }
  .snake-btn {
    background: rgba(0,200,83,.15);
    border: 1px solid rgba(0,200,83,.4);
    border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:#00c853; cursor:pointer;
  }
  .snake-btn:active { transform: scale(.9); background: rgba(0,200,83,.3); }
  .snake-btn.empty { background: transparent; border: none; pointer-events: none; }

  /* ===== INSTAGRAM ===== */
  .ig-stories { display:flex; gap:14px; padding: 12px 14px;
    overflow-x:auto; border-bottom:1px solid rgba(255,255,255,.06);
    scrollbar-width: none; }
  .ig-stories::-webkit-scrollbar { display:none; }
  .ig-story { display:flex; flex-direction:column;
    align-items:center; gap:6px; flex-shrink:0; }
  .ig-story-ring {
    width:60px; height:60px; border-radius:50%;
    padding:2.5px;
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    display:flex; align-items:center; justify-content:center;
  }
  .ig-story-ring .in {
    width:100%; height:100%; border-radius:50%;
    background:#000; padding:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
  }
  .ig-story .lbl { font-size:10px; color:#ccc; max-width:60px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

function renderHome(){
  const home = $('#home');
  home.innerHTML = '';
  APPS.forEach(a => {
    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML = `
      <div class="icon ${a.cls}">${a.icon}</div>
      <div class="label">${a.label}</div>
    `;
    el.addEventListener('click', () => openApp(a.id));
    home.appendChild(el);
  });
}
renderHome();

/* ===== OPEN APP ===== */
function openApp(id){
  const app = APPS.find(a => a.id === id);
  currentApp = app;
  recentApps = recentApps.filter(a => a.id !== id);
  recentApps.unshift(app);
  if (recentApps.length > 5) recentApps.pop();

  const appbar = $('#appbar');
  const titleText = $('#appTitleText');
  appbar.classList.remove('yt', 'tt');

  if (id === 'youtube') {
    appbar.classList.add('yt');
    titleText.textContent = 'YouTube';
  } else if (id === 'tiktok') {
    appbar.classList.add('tt');
    titleText.textContent = 'TikTok';
  } else {
    titleText.textContent = app.label;
  }

  $('#appContent').innerHTML = (UI[id] ? UI[id]() : '<div style="padding:40px;text-align:center;color:#666">Halaman kosong</div>');
  $('#appview').style.display = 'flex';
  $('#home').classList.add('hidden');
  $('#recentView').style.display = 'none';

  if (id === 'calc') initCalc();
  if (id === 'phone') initDialer();
  if (id === 'snake') initSnake();
  if (id === 'paint') initPaint();
  if (id === 'insta') initInsta();
  if (id === 'youtube') initYouTube();
  if (id === 'tiktok') initTikTokApp();
}

function closeApp(){
  if (!currentApp) return;

  // Stop TikTok + YouTube
  if (currentApp.id === 'tiktok') closeTikTokApp();
  if (currentApp.id === 'youtube') {
    const v = $('#videoEl');
    if (v) { v.pause(); v.src = ''; }
  }

  const v = $('#appview');
  v.classList.add('closing');
  setTimeout(() => {
    v.style.display = 'none';
    v.classList.remove('closing');
    $('#home').classList.remove('hidden');
    $('#appbar').classList.remove('yt', 'tt');
    currentApp = null;
    if (snakeState) { clearInterval(snakeState.interval); snakeState = null; }
  }, 240);
}

  if ($('#recentView').style.display === 'flex') {

  } else if (currentApp) closeApp();
});
$('#navHome').addEventListener('click', () => {
  $('#recentView').style.display = 'none';
  if (currentApp) closeApp();
  else { $('#home').classList.remove('hidden'); $('#appview').style.display = 'none'; }
});

  const rv = $('#recentView');
  if (rv.style.display === 'flex') rv.style.display = 'none';

});

function initCalc(){
  const display = $('#calcDisplay');
  let current = '0', prev = null, op = null, fresh = false;
  $$('.calc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.c;
      if (c === 'AC'){ current='0'; prev=null; op=null; fresh=false; }
      else if (c === '+/-'){ current = (parseFloat(current) * -1).toString(); }
      else if (c === '%'){ current = (parseFloat(current) / 100).toString(); }
      else if (['+','-','×','÷'].includes(c)){
        if (op && !fresh) current = calc(prev, parseFloat(current), op).toString();
        prev = parseFloat(current); op = c; fresh = true;
      }
      else if (c === '='){
        if (op){ current = calc(prev, parseFloat(current), op).toString(); op=null; prev=null; }
        fresh = true;
      }
      else if (c === '.'){
        if (fresh){ current = '0.'; fresh = false; }
        else if (!current.includes('.')) current += '.';
      }
      else {
        if (fresh){ current = c; fresh = false; }
        else current = current === '0' ? c : current + c;
      }
      display.textContent = current;
    });
  });
  function calc(a, b, o){
    switch(o){
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 0 : a / b;
    }
    return b;
  }
}

let snakeState = null;
function initSnake(){
  const canvas = $('#snakeCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cell = 15, cols = 20, rows = 20;
  let snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  let dir = {x:1,y:0}, nextDir = {x:1,y:0};
  let food = {x:15,y:10};
  let score = 0;
  let best = parseInt(localStorage.getItem('snakeBest') || '0');
  $('#snakeBest').textContent = best;

  function spawnFood(){
    while (true){
      const fx = Math.floor(Math.random()*cols), fy = Math.floor(Math.random()*rows);
      if (!snake.some(s => s.x === fx && s.y === fy)) { food = {x:fx,y:fy}; return; }
    }
  }
  function step(){
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y)) dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y){
      score += 10; $('#snakeScore').textContent = score; spawnFood();
    } else snake.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle = '#0a1a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(0,200,83,.06)';
    for (let i = 0; i <= cols; i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(canvas.width,i*cell); ctx.stroke();
    }
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath(); ctx.arc(food.x*cell+cell/2, food.y*cell+cell/2, cell/2-1, 0, Math.PI*2); ctx.fill();
    snake.forEach((s,i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#00ff88' : `rgb(${0 + t*20}, ${200 - t*100}, ${83 - t*40})`;
      if (ctx.roundRect) ctx.roundRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2, 4);
      else ctx.rect(s.x*cell+1, s.y*cell+1, cell-2, cell-2);
      ctx.fill();
    });
    const h = snake[0];
    if (h){
      ctx.fillStyle = '#000';
      const cx = h.x*cell+cell/2, cy = h.y*cell+cell/2, off = 3;
      let ex1,ey1,ex2,ey2;
      if (dir.x === 1){ ex1=cx+2; ey1=cy-off; ex2=cx+2; ey2=cy+off; }
      else if (dir.x === -1){ ex1=cx-2; ey1=cy-off; ex2=cx-2; ey2=cy+off; }
      else if (dir.y === 1){ ex1=cx-off; ey1=cy+2; ex2=cx+off; ey2=cy+2; }
      else { ex1=cx-off; ey1=cy-2; ex2=cx+off; ey2=cy-2; }
      ctx.beginPath(); ctx.arc(ex1,ey1,1.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2,ey2,1.5,0,Math.PI*2); ctx.fill();
    }
  }
  function gameOver(){
    clearInterval(snakeState.interval);
    if (score > best){ best = score; localStorage.setItem('snakeBest', best); }
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ff3b30'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
    ctx.fillText('Skor: ' + score, canvas.width/2, canvas.height/2 + 20);
    ctx.fillStyle = '#00c853';
    ctx.fillText('Tap untuk main lagi', canvas.width/2, canvas.height/2 + 50);
    canvas.onclick = () => {
      canvas.onclick = null;
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1,y:0}; nextDir = {x:1,y:0}; score = 0;
      $('#snakeScore').textContent = 0;
      spawnFood(); draw();
      snakeState.interval = setInterval(step, 130);
    };
  }
  $$('.snake-btn[data-dir]').forEach(b => {
    b.addEventListener('click', () => {
      const d = b.dataset.dir;
      if (d === 'up' && dir.y !== 1) nextDir = {x:0,y:-1};
      if (d === 'down' && dir.y !== -1) nextDir = {x:0,y:1};
      if (d === 'left' && dir.x !== 1) nextDir = {x:-1,y:0};
      if (d === 'right' && dir.x !== -1) nextDir = {x:1,y:0};
    });
  });
  let sx=0, sy=0;
  canvas.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)){
      if (dx > 0 && dir.x !== -1) nextDir = {x:1,y:0};
      else if (dx < 0 && dir.x !== 1) nextDir = {x:-1,y:0};
    } else {
      if (dy > 0 && dir.y !== -1) nextDir = {x:0,y:1};
      else if (dy < 0 && dir.y !== 1) nextDir = {x:0,y:-1};
    }
  }, {passive:true});
  draw();
  snakeState = { interval: setInterval(step, 130) };
}

function initPaint(){
  const canvas = $('#paintCanvas');
  if (!canvas) return;
  function resize(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  setTimeout(resize, 100);
  let color = '#000000', size = 2, drawing = false, lastX = 0, lastY = 0;
  $$('.paint-color').forEach(el => {
    el.addEventListener('click', () => {
      $$('.paint-color').forEach(x => x.classList.remove('active'));
      el.classList.add('active'); color = el.dataset.color;
    });
  });
  $$('.paint-size').forEach(el => {
    el.addEventListener('click', () => {
      if (el.id === 'paintClear'){
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, rect.width, rect.height);
        return;
      }
      $$('.paint-size').forEach(x => x.classList.remove('active'));
      el.classList.add('active'); size = parseInt(el.dataset.size);
    });
  });
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function start(e){
    e.preventDefault(); drawing = true;
    const p = getPos(e); lastX = p.x; lastY = p.y;
  }
  function move(e){
    if (!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = color; ctx.lineWidth = size;
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
}

function ytFmtDur(sec){
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function ytToast(msg){
  const t = $('#ytToast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function ytEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

}

function renderYtList(){
  const list = $('#ytList');
  if (!list) return;
  list.innerHTML = YT_VIDEOS.map((v,i) => `
    <div class="yt-item" data-idx="${i}">
      <div class="yt-thumb">
        <div class="play-ic">▶</div>
        <div class="duration" id="ytDur-${i}">--:--</div>

      <div class="yt-info">
        <div class="yt-title">${ytEsc(v.title)}</div>
        <div class="yt-meta">Channel Saya · 1.2K views<br>${i+1} hari lalu</div>
      </div>
      <div class="yt-edit" data-edit="${i}">⋯</div>
    </div>
  `).join('');

  YT_VIDEOS.forEach((v,i) => {
    const tv = document.createElement('video');
    tv.preload = 'metadata'; tv.src = v.url;
    tv.addEventListener('loadedmetadata', () => {
      const el = document.getElementById(`ytDur-${i}`);
      if (el) el.textContent = ytFmtDur(tv.duration);
    });
    tv.addEventListener('error', () => {
      const el = document.getElementById(`ytDur-${i}`);
      if (el) el.textContent = 'error';
    });
  });

  $$('.yt-item').forEach(el => {
    el.addEventListener('click', (e) => {

  });

  player.classList.add('show');
  videoEl.play().catch(()=>{});
}

  const player = $('#ytPlayer');

  if (player) player.classList.remove('show');

}

let ttCurrentCommentIdx = -1;
let ttAudioUnlocked = false;

function ttFmtTime(sec){
  if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function ttVideoHtml(v, idx){
  const userInitial = (v.user || '@u').replace('@','').charAt(0).toUpperCase();
  const commentCount = (TT_COMMENTS[idx] || []).length;
  const displayCommentCount = commentCount > 0 ? commentCount : (v.comments || '0');

  return `
    <div class="tt-video" data-idx="${idx}">
      <video src="${v.url}" playsinline webkit-playsinline loop muted preload="metadata"></video>
      <div class="tt-speed"><span class="arrow">▶▶</span><span>2x</span></div>
      <div class="tt-tap-emoji"></div>

      <div class="tt-bottom">
        <div class="tt-info">
          <div class="tt-uname">${v.user || '@user'}</div>
          <div class="tt-caption">${v.caption || ''}</div>
        </div>

        <div class="tt-progress-wrap" data-progress>
          <div class="tt-progress-times">
            <span data-cur-time>0:00</span>
            <span data-total-time>0:00</span>
          </div>
          <div class="tt-progress-track">
            <div class="tt-progress-bar-bg">
              <div class="tt-progress-bar-fill" data-fill></div>
            </div>
            <div class="tt-progress-knob" data-knob></div>
          </div>
        </div>
      </div>

      <div class="tt-actions">
        <div class="tt-action"><div class="av">${userInitial}</div></div>
        <div class="tt-action" data-like>
          <div class="ic">🤍</div>
          <div class="cnt">${v.likes || '0'}</div>
        </div>
        <div class="tt-action" data-comment="${idx}">
          <div class="ic">💬</div>
          <div class="cnt">${displayCommentCount}</div>
        </div>
        <div class="tt-action">
          <div class="ic">↗️</div>
          <div class="cnt">${v.shares || '0'}</div>
        </div>
      </div>
    </div>
  `;
}

function ttBuildBatch(){
  return TT_VIDEOS.map((v, i) => ttVideoHtml(v, i)).join('');
}

function initTikTokApp(){
  const feed = $('#ttFeed');
  if (!feed) return;

  feed.innerHTML = '';
  feed.insertAdjacentHTML('beforeend', ttBuildBatch());

  ttBindActions();

  // Observer
  ttObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const videoEl = entry.target.querySelector('video');
      if (!videoEl) return;

      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        try { videoEl.currentTime = 0; } catch(e) {}

        videoEl.muted = !ttAudioUnlocked;

        const promise = videoEl.play();
        if (promise) {
          promise.catch(() => {
            videoEl.muted = true;
            videoEl.play().then(() => {
              if (ttAudioUnlocked) {
                setTimeout(() => { videoEl.muted = false; }, 100);
              }
            }).catch(() => {});
          });
        }
      } else {
        videoEl.pause();
        videoEl.playbackRate = 1;
        try { videoEl.currentTime = 0; } catch(e) {}
      }
    });
  }, { root: feed, threshold: [0.6] });

  feed.querySelectorAll('.tt-video').forEach(el => ttObserver.observe(el));

  // Audio unlock
  const unlockFn = () => {
    if (ttAudioUnlocked) return;
    ttAudioUnlocked = true;
    feed.querySelectorAll('video').forEach(v => {
      if (!v.paused) { v.muted = false; v.play().catch(() => {}); }
    });
  };
  feed.addEventListener('touchstart', unlockFn, { once: true, passive: true });
  feed.addEventListener('scroll', unlockFn, { once: true, passive: true });
  feed.addEventListener('click', unlockFn, { once: true });
}

function ttBindActions(){
  const feed = $('#ttFeed');
  if (!feed) return;

  // Like
  feed.querySelectorAll('[data-like]').forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const ic = el.querySelector('.ic');
      const cnt = el.querySelector('.cnt');
      const isLiked = ic.textContent === '❤️';
      ic.textContent = isLiked ? '🤍' : '❤️';
      const n = ttParseLike(cnt.textContent);
      cnt.textContent = ttFormatLike(n + (isLiked ? -1 : 1));
      if (navigator.vibrate) navigator.vibrate(20);
    });
    el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
  });

  // Comment
  feed.querySelectorAll('[data-comment]').forEach(el => {
    if (el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      ttOpenComments(parseInt(el.dataset.comment));
    });
    el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
  });

  // Video events
  feed.querySelectorAll('.tt-video').forEach(wrap => {
    if (wrap.dataset.videoBound) return;
    wrap.dataset.videoBound = '1';

    const videoEl = wrap.querySelector('video');
    if (!videoEl) return;

    const fill = wrap.querySelector('[data-fill]');
    const knob = wrap.querySelector('[data-knob]');
    const curTimeEl = wrap.querySelector('[data-cur-time]');
    const totalTimeEl = wrap.querySelector('[data-total-time]');

    videoEl.addEventListener('loadedmetadata', () => {
      if (totalTimeEl) totalTimeEl.textContent = ttFmtTime(videoEl.duration);
    });

    function updateProgress() {
      if (!videoEl.duration) return;
      const pct = (videoEl.currentTime / videoEl.duration) * 100;
      if (fill) fill.style.width = pct + '%';
      if (knob) knob.style.left = pct + '%';
      if (curTimeEl) curTimeEl.textContent = ttFmtTime(videoEl.currentTime);
    }
    videoEl.addEventListener('timeupdate', updateProgress);
    videoEl.addEventListener('progress', updateProgress);

    const progressWrap = wrap.querySelector('[data-progress]');
    if (progressWrap) ttSetupSeek(progressWrap, videoEl);
  });
}

function ttSetupSeek(progressWrap, videoEl){
  const track = progressWrap.querySelector('.tt-progress-track');
  if (!track) return;

  let dragging = false;
  let wasPlaying = false;

  function getPct(clientX){
    const rect = track.getBoundingClientRect();
    let x = clientX - rect.left;
    x = Math.max(0, Math.min(x, rect.width));
    return x / rect.width;
  }
  function apply(clientX){
    if (!videoEl.duration) return;
    const pct = getPct(clientX);
    try { videoEl.currentTime = pct * videoEl.duration; } catch(e){}
    const fill = progressWrap.querySelector('[data-fill]');
    const knob = progressWrap.querySelector('[data-knob]');
    const curTimeEl = progressWrap.querySelector('[data-cur-time]');
    if (fill) fill.style.width = (pct * 100) + '%';
    if (knob) knob.style.left = (pct * 100) + '%';
    if (curTimeEl) curTimeEl.textContent = ttFmtTime(pct * videoEl.duration);
  }
  function start(e){
    e.stopPropagation(); e.preventDefault();
    dragging = true;
    progressWrap.classList.add('dragging');
    wasPlaying = !videoEl.paused;
    if (wasPlaying) videoEl.pause();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    apply(x);
  }
  function move(e){
    if (!dragging) return;
    e.stopPropagation(); e.preventDefault();
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    apply(x);
  }
  function end(e){
    if (!dragging) return;
    dragging = false;
    progressWrap.classList.remove('dragging');
    if (wasPlaying) videoEl.play().catch(()=>{});
  }

  progressWrap.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  track.addEventListener('touchstart', start, { passive: false });
  track.addEventListener('touchmove', move, { passive: false });
  track.addEventListener('touchend', end);
  track.addEventListener('touchcancel', end);
}

function ttParseLike(str){
  str = String(str).trim();
  if (str.endsWith('K')) return parseFloat(str) * 1000;
  if (str.endsWith('M')) return parseFloat(str) * 1000000;
  return parseFloat(str) || 0;
}
function ttFormatLike(n){
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0','') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0','') + 'K';
  return String(Math.round(n));
}
function ttRandomTime(){
  const t = ['1m','2m','5m','12m','30m','1j','2j','5j','1h','2h','1d','2d','3d'];
  return t[Math.floor(Math.random() * t.length)];
}

/* TT comment sheet */
function ttOpenComments(idx){
  ttCurrentCommentIdx = idx;
  const list = TT_COMMENTS[idx] || [];
  $('#ttCsTitle').textContent = list.length + ' komentar';

  const csList = $('#ttCsList');
  if (list.length === 0){
    csList.innerHTML = `<div style="text-align:center;color:#666;padding:40px 20px;font-size:14px">Belum ada komentar.</div>`;
  } else {
    csList.innerHTML = list.map((c,i) => `
      <div class="tt-cs-item">
        <div class="tt-cs-avatar" style="background:${c.c||'#666'}">${c.name.charAt(0).toUpperCase()}</div>
        <div class="tt-cs-body">
          <div class="tt-cs-name">${c.name}</div>
          <div class="tt-cs-text">${c.text}</div>
          <div class="tt-cs-meta"><span>${ttRandomTime()}</span><span>Balas</span></div>
        </div>
        <div class="tt-cs-like">
          <div class="heart">🤍</div>
          <div class="cnt">${c.likes||'0'}</div>
        </div>
      </div>
    `).join('');

    csList.querySelectorAll('.tt-cs-like').forEach(el => {
      el.addEventListener('click', () => {
        const heart = el.querySelector('.heart');
        const cnt = el.querySelector('.cnt');
        const liked = heart.classList.toggle('liked');
        heart.textContent = liked ? '❤️' : '🤍';
        const n = ttParseLike(cnt.textContent);
        cnt.textContent = ttFormatLike(n + (liked ? 1 : -1));
      });
    });
  }

  $('#ttCommentSheet').classList.add('show');
  $('#ttSheetOverlay').classList.add('show');
  // Pause video
  const feed = $('#ttFeed');
  if (feed) feed.querySelectorAll('video').forEach(v => v.pause());
}

function ttCloseComments(){
  $('#ttCommentSheet').classList.remove('show');
  $('#ttSheetOverlay').classList.remove('show');
}

$('#ttCsClose').addEventListener('click', ttCloseComments);
$('#ttSheetOverlay').addEventListener('click', ttCloseComments);

$('#ttCsInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const val = $('#ttCsInput').value.trim();
  if (!val) return;
  const idx = ttCurrentCommentIdx;
  if (idx < 0) return;
  if (!TT_COMMENTS[idx]) TT_COMMENTS[idx] = [];
  TT_COMMENTS[idx].unshift({ name:"@kamu", text:val, likes:"0", c:"#fe2c55" });
  $('#ttCsInput').value = '';
  ttOpenComments(idx);
  $('#ttCsList').scrollTop = 0;
});

/* Close TikTok app */
function closeTikTokApp(){
  const feed = $('#ttFeed');
  if (feed) {
    feed.querySelectorAll('video').forEach(v => {
      v.pause();
      v.src = '';
    });
  }
  ttCloseComments();
  if (ttObserver) { ttObserver.disconnect(); ttObserver = null; }
}

let ttObserver = null;

/* =========================================================
   TAP & LONG PRESS HANDLER (global, detect dari .tt-video)
   ========================================================= */
const TT_LONG_PRESS_DELAY = 250;
let ttLongTimer = null;
let ttLongActive = false;
let ttPressWrap = null;
let ttStartY = 0, ttStartX = 0;
let ttIsScrolling = false;
let ttPressStart = 0;
let ttLastTouch = 0;

function ttIsSyntheticMouse(){ return Date.now() - ttLastTouch < 700; }

function ttOnStart(e){
  if (e.target.closest('.tt-action')) return;
  if (e.target.closest('.tt-progress-wrap')) return;

  const wrap = e.target.closest('.tt-video');
  if (!wrap) return;
  const videoEl = wrap.querySelector('video');
  if (!videoEl) return;

  ttPressWrap = wrap;
  ttLongActive = false;
  ttIsScrolling = false;
  ttPressStart = Date.now();

  const t = e.touches ? e.touches[0] : e;
  ttStartY = t.clientY;
  ttStartX = t.clientX;

  clearTimeout(ttLongTimer);
  ttLongTimer = setTimeout(() => {
    ttLongActive = true;
    videoEl.playbackRate = 2;
    const sp = wrap.querySelector('.tt-speed');
    if (sp) sp.classList.add('show');
    if (navigator.vibrate) navigator.vibrate(30);
  }, TT_LONG_PRESS_DELAY);
}

function ttOnEnd(e){
  clearTimeout(ttLongTimer);
  const dur = Date.now() - ttPressStart;

  if (ttPressWrap){
    const v = ttPressWrap.querySelector('video');
    if (v) v.playbackRate = 1;
    const sp = ttPressWrap.querySelector('.tt-speed');
    if (sp) sp.classList.remove('show');
  }

  if (ttLongActive){ ttLongActive = false; ttPressWrap = null; return; }
  if (ttIsScrolling){ ttPressWrap = null; return; }

  const wrap = ttPressWrap;
  ttPressWrap = null;
  if (!wrap) return;
  const videoEl = wrap.querySelector('video');
  if (!videoEl) return;

  if (dur < TT_LONG_PRESS_DELAY){
    if (!ttAudioUnlocked) {
      ttAudioUnlocked = true;
    }
    if (videoEl.paused){
      videoEl.muted = false;
      videoEl.play().catch(()=>{});
    } else {
      videoEl.pause();
      const emojiEl = wrap.querySelector('.tt-tap-emoji');
      if (emojiEl){
        emojiEl.classList.remove('show');
        emojiEl.textContent = '▶️';
        void emojiEl.offsetWidth;
        emojiEl.classList.add('show');
      }
    }
  }
}

function ttOnMove(e){
  if (!ttPressWrap) return;
  const t = e.touches ? e.touches[0] : e;
  const dy = Math.abs(t.clientY - ttStartY);
  const dx = Math.abs(t.clientX - ttStartX);
  if (dy > 10 || dx > 10){
    ttIsScrolling = true;
    clearTimeout(ttLongTimer);
    if (ttPressWrap){
      const v = ttPressWrap.querySelector('video');
      if (v) v.playbackRate = 1;
      const sp = ttPressWrap.querySelector('.tt-speed');
      if (sp) sp.classList.remove('show');
    }
    ttPressWrap = null;
  }
}

// Listener global (event delegation) — pasang sekali
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  ttLastTouch = Date.now();
  ttOnStart(e);
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  ttLastTouch = Date.now();
  ttOnEnd(e);
});

document.addEventListener('touchmove', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  ttLastTouch = Date.now();
  ttOnMove(e);
}, { passive: true });

document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  if (ttIsSyntheticMouse()) return;
  ttOnStart(e);
});

document.addEventListener('mouseup', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  if (ttIsSyntheticMouse()) return;
  ttOnEnd(e);
});

document.addEventListener('mousemove', (e) => {
  if (!e.target.closest('#ttFeed')) return;
  if (ttIsSyntheticMouse()) return;
  ttOnMove(e);
});
</script>
